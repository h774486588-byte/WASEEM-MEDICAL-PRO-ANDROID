name: Build Waseem Medical APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. البحث عن ملف ZIP
      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Searching for project ZIP..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name '*.zip' \
            -not -path '*/.git/*' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::لم يتم العثور على ملف ZIP للمشروع."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # 4. فك ضغط المشروع
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"

          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Project extracted successfully."

          echo "Searching Gradle files..."

          find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \
            \) \
            -print

      # 5. تحديد مجلد مشروع Android
      - name: Locate Android project
        id: locate_project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do

            DIR=$(dirname "$SETTINGS_FILE")

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o -name 'settings.gradle.kts' \
              \)
          )

          if [ -z "$PROJECT_DIR" ]; then

            echo "::error::لم يتم العثور على مشروع Android Gradle."

            echo "Available project files:"

            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "======================================"
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 6. إعداد Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. بناء APK
      - name: Build Debug APK
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Starting Android build..."

          if [ -f "./gradlew" ]; then

            echo "Gradle Wrapper detected."

            chmod +x ./gradlew

            ./gradlew \
              assembleDebug \
              --stacktrace

          else

            echo "Gradle Wrapper not found."
            echo "Using installed Gradle."

            gradle \
              assembleDebug \
              --stacktrace

          fi

      # 8. البحث عن APK الناتج
      - name: Find generated APK
        id: find_apk
        working-directory: ${{ steps.locate_project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_FILE=$(find . \
            -type f \
            -name '*.apk' \
            -print \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then

            echo "::error::لم يتم إنشاء APK."

            echo "APK search directory:"
            pwd

            echo "Build output:"
            find . \
              -type f \
              \( \
                -name '*.apk' \
                -o -name '*.aab' \
              \) \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      # 9. نسخ APK إلى مسار ثابت
      #    هذه الخطوة تحل مشكلة:
      #    Invalid pattern './...'
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/artifact"

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          SOURCE_APK="${{ steps.locate_project.outputs.project_dir }}/${{ steps.find_apk.outputs.apk_file }}"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::ملف APK غير موجود في المسار المتوقع:"
            echo "$SOURCE_APK"
            exit 1
          fi

          cp "$SOURCE_APK" \
             "$GITHUB_WORKSPACE/artifact/Waseem-Medical-Pro.apk"

          echo "APK prepared successfully."

          ls -lh "$GITHUB_WORKSPACE/artifact/Waseem-Medical-Pro.apk"

      # 10. رفع APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Waseem-Medical-Pro-APK
          path: artifact/Waseem-Medical-Pro.apk
          if-no-files-found: error
          retention-days: 30

      # 11. معلومات نهائية
      - name: Build summary
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"

          echo "APK:"
          ls -lh "$GITHUB_WORKSPACE/artifact/Waseem-Medical-Pro.apk"

          echo ""
          echo "The APK artifact is ready."
