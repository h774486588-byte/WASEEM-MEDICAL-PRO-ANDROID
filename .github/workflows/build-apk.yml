name: Build Waseem Medical Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name '*.zip' \
            -not -path '*/.git/*' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::لم يتم العثور على ملف ZIP للمشروع."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q -o \
            "${{ steps.find_zip.outputs.zip_file }}" \
            -d "$GITHUB_WORKSPACE/extracted"

          echo "Project extracted."

      - name: Locate Flutter project
        id: locate_flutter
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r PUBSPEC; do
            DIR=$(dirname "$PUBSPEC")

            if [ -d "$DIR/lib" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name 'pubspec.yaml'
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::لم يتم العثور على مشروع Flutter."
            echo "ملفات المشروع الموجودة:"
            find "$GITHUB_WORKSPACE/extracted" \
              -maxdepth 7 \
              -type f \
              | sort
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "======================================"
          echo "FLUTTER PROJECT:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter version
        shell: bash
        run: |
          flutter --version

      - name: Flutter pub get
        working-directory: ${{ steps.locate_flutter.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          flutter pub get

      - name: Flutter analyze
        working-directory: ${{ steps.locate_flutter.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          flutter analyze

      - name: Build Release APK
        working-directory: ${{ steps.locate_flutter.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          flutter build apk \
            --release \
            --no-tree-shake-icons

      - name: Find generated APK
        id: find_apk
        working-directory: ${{ steps.locate_flutter.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK_FILE=$(find build/app/outputs/flutter-apk \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "::error::لم يتم إنشاء APK."
            find build -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK found: $APK_FILE"
          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/artifact"
          mkdir -p "$GITHUB_WORKSPACE/artifact"

          SOURCE_APK="${{ steps.locate_flutter.outputs.project_dir }}/${{ steps.find_apk.outputs.apk_file }}"

          if [ ! -f "$SOURCE_APK" ]; then
            echo "::error::APK غير موجود:"
            echo "$SOURCE_APK"
            exit 1
          fi

          cp "$SOURCE_APK" \
            "$GITHUB_WORKSPACE/artifact/Waseem-Medical-Pro.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/artifact/Waseem-Medical-Pro.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Waseem-Medical-Pro-APK
          path: artifact/Waseem-Medical-Pro.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"
          echo "Waseem Medical Pro APK is ready."
          ls -lh "$GITHUB_WORKSPACE/artifact/Waseem-Medical-Pro.apk"
