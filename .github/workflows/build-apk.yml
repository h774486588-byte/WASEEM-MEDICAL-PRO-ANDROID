name: Build Waseem Medical APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::لم يتم العثور على ملف ZIP للمشروع"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -q -o "$ZIP_FILE" -d extracted

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r settings; do
            DIR=$(dirname "$settings")

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted \
            -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::لم يتم العثور على مشروع Android"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup
