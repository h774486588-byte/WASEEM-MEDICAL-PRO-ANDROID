name: Build Waseem Medical APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name '*.zip' -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Project ZIP file was not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r settings_file; do
            DIR=$(dirname "$settings_file")

            if [ -f "$DIR/build.gradle" ] || [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android Gradle project was not found."
            echo "Searching for Gradle files..."
            find extracted -type f \
              \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' \) \
              -print
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK=$(find . -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "Generated APK: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Waseem-Medical-Pro-APK
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
